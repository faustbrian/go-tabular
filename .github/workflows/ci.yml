name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      release_dry_run:
        description: Run the stable release rehearsal
        required: false
        default: false
        type: boolean
      root_release_qualification:
        description: Run the complete root release contract with pinned source-built tooling
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  security-events: write

jobs:
  selection:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      root_release_qualification: ${{ steps.select.outputs.root_release_qualification }}
    steps:
      - id: select
        name: Reject conflicting workflow selectors
        env:
          RELEASE_DRY_RUN: ${{ inputs.release_dry_run || false }}
          ROOT_RELEASE_QUALIFICATION: ${{ inputs.root_release_qualification || false }}
        run: |
          set -euo pipefail
          selected=0
          for value in "${RELEASE_DRY_RUN}" "${ROOT_RELEASE_QUALIFICATION}"; do
            case "${value}" in
              true) selected=$((selected + 1)) ;;
              false) ;;
              *) exit 1 ;;
            esac
          done
          test "${selected}" -le 1
          printf 'root_release_qualification=%s\n' "${ROOT_RELEASE_QUALIFICATION}" >>"${GITHUB_OUTPUT}"

  ci:
    needs: selection
    uses: faustbrian/go-library-tools/.github/workflows/library-ci.yml@13d685e06cd4f01990eb95a4590ea67953a0c753 # v1.4.0 W14 enforcement
    with:
      tooling_sha: 531e4db50fd81a7201257a7b488a0cf22d333aca
      release_dry_run: ${{ inputs.release_dry_run || false }}

  root-release-qualification:
    name: Full root release qualification
    needs: [selection, ci]
    if: github.event_name == 'workflow_dispatch' && needs.selection.outputs.root_release_qualification == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      GOENV: off
      GOWORK: off
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      GOFLAGS: -p=1
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
    steps:
      - name: Initialize private qualification workspace
        env:
          TASK_ROOT: ${{ runner.temp }}/golib-tabular-release-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p "${TASK_ROOT}/build" "${TASK_ROOT}/modules" "${TASK_ROOT}/tmp" "${TASK_ROOT}/lint" "${TASK_ROOT}/xdg" "${TASK_ROOT}/npm"
          printf 'GOCACHE=%s\nGOMODCACHE=%s\nGOTMPDIR=%s\nTMPDIR=%s\nGOLANGCI_LINT_CACHE=%s\nXDG_CACHE_HOME=%s\nnpm_config_cache=%s\n' \
            "${TASK_ROOT}/build" "${TASK_ROOT}/modules" "${TASK_ROOT}/tmp" "${TASK_ROOT}/tmp" \
            "${TASK_ROOT}/lint" "${TASK_ROOT}/xdg" "${TASK_ROOT}/npm" >>"${GITHUB_ENV}"
      - name: Check out complete producer history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: release-producer
          persist-credentials: false
          fetch-depth: 0
      - name: Check out exact supported development tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: faustbrian/go-library-tools
          ref: dbce31aab4f15b3440e0559d3e2bad8912b6e567
          path: release-tooling
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.0'
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Build honest source-development CLI
        working-directory: release-tooling
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = dbce31aab4f15b3440e0559d3e2bad8912b6e567
          go build -p 1 -trimpath -buildvcs=false -o "${GOTMPDIR}/golib" ./cmd/golib
          test "$("${GOTMPDIR}/golib" --version)" = dev
      - name: Prove wire sector admission on linux 386
        timeout-minutes: 10
        working-directory: release-producer
        env:
          GOOS: linux
          GOARCH: '386'
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          proof_root=$(mktemp -d "${GOTMPDIR}/ole-width.XXXXXX")
          trap 'find "${proof_root}" -type d -exec chmod u+w {} +; find "${proof_root}" -depth -delete' EXIT
          mkdir "${proof_root}/before"
          git archive 1d21d21cd7144cd1b041fb35bc69878ae513ba12 | tar -x -C "${proof_root}/before"
          cp internal/xls/ole_admission_width_test.go "${proof_root}/before/internal/xls/"
          for test_name in TestOLEChainRejectsUnrepresentableSectorID TestOLESectorRejectsUnrepresentableSectorID; do
            case "${test_name}" in
              TestOLEChainRejectsUnrepresentableSectorID) expected_panic='panic: runtime error: index out of range' ;;
              TestOLESectorRejectsUnrepresentableSectorID) expected_panic='panic: runtime error: slice bounds out of range' ;;
            esac
            if (cd "${proof_root}/before" && go test -mod=readonly -p=1 -count=1 -v -run "^${test_name}$" ./internal/xls) >"${proof_root}/${test_name}.log" 2>&1; then
              printf 'Pre-fix 386 admission unexpectedly passed: %s\n' "${test_name}" >&2
              exit 1
            fi
            grep -F -- "${expected_panic}" "${proof_root}/${test_name}.log"
            grep -F -- "--- FAIL: ${test_name}" "${proof_root}/${test_name}.log"
          done
          go test -mod=readonly -p=1 -count=1 -v -run '^(TestOLEChainRejectsUnrepresentableSectorID|TestOLESectorRejectsUnrepresentableSectorID)$' ./internal/xls
      - name: Validate producer authorities and complete root release contract
        working-directory: release-producer
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          "${GOTMPDIR}/golib" repository check
          "${GOTMPDIR}/golib" specification check --online
          "${GOTMPDIR}/golib" release check --module .
          "${GOTMPDIR}/golib" release dry-run --module .
      - name: Retain native qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: root-release-qualification
          path: release-producer/.verification
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Remove private qualification resources
        if: always()
        env:
          TASK_ROOT: ${{ runner.temp }}/golib-tabular-release-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          for owned in "${TASK_ROOT}" "${GITHUB_WORKSPACE}/release-producer" "${GITHUB_WORKSPACE}/release-tooling"; do
            if [[ -d "${owned}" ]]; then
              find "${owned}" -type d -exec chmod u+w {} +
              find "${owned}" -depth -delete
            fi
          done

  required:
    name: Required
    if: always()
    needs: [selection, ci, root-release-qualification]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require shared workflow
        env:
          CI_RESULT: ${{ needs.ci.result }}
          SELECTION_RESULT: ${{ needs.selection.result }}
          ROOT_SELECTED: ${{ needs.selection.outputs.root_release_qualification }}
          ROOT_RESULT: ${{ needs.root-release-qualification.result }}
        run: |
          set -euo pipefail
          test "${SELECTION_RESULT}" = success
          test "${CI_RESULT}" = success
          case "${ROOT_SELECTED}:${ROOT_RESULT}" in
            true:success|false:skipped) ;;
            *) exit 1 ;;
          esac
